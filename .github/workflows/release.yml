name: Build and publish release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to build and publish (for example, 1.1.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64 installer
    needs: prepare
    runs-on: windows-latest
    env:
      DEEJAZZ_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: deejazz-windows-x64-${{ needs.prepare.outputs.version }}
          if-no-files-found: error
          path: dist/deejazz-windows-x64-${{ needs.prepare.outputs.version }}.exe

  linux:
    name: Linux ${{ matrix.arch }} package
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            command: dist:linux
            artifact: amd64
          - arch: arm64
            command: dist:linux:arm64
            artifact: arm64
    env:
      DEEJAZZ_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Linux release downloads
        run: npm run test:installer

      - name: Build Linux package
        run: npm run ${{ matrix.command }}

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: deejazz-linux-${{ matrix.artifact }}-${{ needs.prepare.outputs.version }}
          if-no-files-found: error
          path: |
            dist/deejazz-linux-${{ matrix.artifact }}-${{ needs.prepare.outputs.version }}.tar.gz
            dist/deejazz-linux-${{ matrix.artifact }}-${{ needs.prepare.outputs.version }}.tar.gz.sha256

  android:
    name: Android signed APK
    needs: prepare
    runs-on: ubuntu-latest
    env:
      DEEJAZZ_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android build tools
        shell: bash
        run: |
          archive="$RUNNER_TEMP/build-tools_r35_linux.zip"
          curl -fL --retry 3 https://dl.google.com/android/repository/build-tools_r35_linux.zip -o "$archive"
          printf '%s  %s\n' 'bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88' "$archive" | sha256sum --check -
          unzip -q "$archive" -d "$RUNNER_TEMP/android-build-tools"
          echo "ANDROID_BUILD_TOOLS=$RUNNER_TEMP/android-build-tools/android-15" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build, sign and verify Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/deejazz-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          npm run dist:android

      - name: Upload Android APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: deejazz-android-${{ needs.prepare.outputs.version }}
          if-no-files-found: error
          path: |
            Dist/deejazz-android-${{ needs.prepare.outputs.version }}.apk
            Dist/deejazz-android-${{ needs.prepare.outputs.version }}.apk.sha256

  release:
    name: Publish GitHub release
    needs: [prepare, windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify release filenames and checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          version = os.environ['VERSION']
          folder = Path('release-assets')
          packages = {f'deejazz-windows-x64-{version}.exe',
                      f'deejazz-linux-amd64-{version}.tar.gz',
                      f'deejazz-linux-arm64-{version}.tar.gz',
                      f'deejazz-android-{version}.apk'}
          checksums = {name + '.sha256' for name in packages if not name.endswith('.exe')}
          actual = {file.name for file in folder.iterdir()}
          if actual != packages | checksums:
              raise SystemExit(f'Unexpected release assets: {actual ^ (packages | checksums)}')
          for name in packages:
              if not (folder / name).is_file() or (folder / name).stat().st_size == 0:
                  raise SystemExit(f'Missing or empty release package: {name}')
          for name in checksums:
              checksum, filename = (folder / name).read_text().strip().split('  ', 1)
              if filename != name.removesuffix('.sha256'):
                  raise SystemExit(f'Checksum filename mismatch: {name}')
              if hashlib.sha256((folder / filename).read_bytes()).hexdigest() != checksum:
                  raise SystemExit(f'Checksum mismatch: {filename}')
          print(f'All {len(actual)} release assets match version {version}; checksums verified.')
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"
          gh release create "$TAG_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DeeJazz $VERSION" \
            --generate-notes
